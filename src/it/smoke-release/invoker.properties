invoker.name = wago-release goal execution smoke test
invoker.description = Runs the wago-release goal in a real plugin ClassRealm so runtime-classpath failures (e.g. NoClassDefFoundError from provided-scope transitives) surface during verify
invoker.goals = com.ragedunicorn.tools.maven:wago-release-maven-plugin:wago-release
# The Wago.io endpoint is hardcoded in WagoClient, so route it through an unroutable local
# proxy (honored via HttpClientBuilder.useSystemProperties) - refuses the connection without
# any real Wago.io call or credentials
invoker.mavenOpts = -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=1
invoker.buildResult = failure
